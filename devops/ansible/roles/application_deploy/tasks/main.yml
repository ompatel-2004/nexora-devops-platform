---
- name: Ensure target deployment directory exists
  ansible.windows.win_file:
    path: "{{ deploy_path }}"
    state: directory

- name: Stop IIS Application Pool prior to extraction
  ansible.windows.win_iis_webapppool:
    name: "{{ app_pool_name }}"
    state: stopped
  ignore_errors: yes

- name: Extract application release archive
  community.windows.win_unzip:
    src: "{{ artifact_path }}"
    dest: "{{ deploy_path }}"
    delete_archive: no

- name: Template runtime application settings
  ansible.windows.win_copy:
    dest: "{{ deploy_path }}\\appsettings.json"
    content: |
      {
        "Logging": { "LogLevel": { "Default": "Information" } },
        "AllowedHosts": "*",
        "ConnectionStrings": {
          "InventoryDb": "Host=localhost;Port=5432;Database=inventory_db;Username=nexora_admin;Password={{ lookup('env', 'DB_PASSWORD') | default('', true) }};"
        },
        "APP_VERSION": "{{ app_version }}",
        "SIMULATE_FAILURE": "{{ simulate_fail | default('false') }}"
      }
  when: app_name == 'inventory-api'

- name: Start IIS Application Pool
  ansible.windows.win_iis_webapppool:
    name: "{{ app_pool_name }}"
    state: started

- name: Restart IIS Site
  ansible.windows.win_iis_website:
    name: "{{ site_name }}"
    state: restarted
  ignore_errors: yes

- name: Record deployment metadata in PostgreSQL audit table
  delegate_to: localhost
  community.postgresql.postgresql_query:
    db: "inventory_db"
    login_host: "localhost"
    login_user: "nexora_admin"
    login_password: "{{ lookup('env', 'DB_PASSWORD') | default('', true) }}"
    query: >
      INSERT INTO deployments (application, version, environment, status, commit_sha, pipeline_id, completed_at)
      VALUES ('{{ app_name }}', '{{ app_version }}', '{{ env_name }}', 'SUCCESS', 'HEAD', 'manual', CURRENT_TIMESTAMP);
  ignore_errors: no
