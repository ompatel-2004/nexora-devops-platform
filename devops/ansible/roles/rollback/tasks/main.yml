---
- name: Stop running application service or pool
  block:
    - name: Stop IIS AppPool
      ansible.windows.win_iis_webapppool:
        name: "{{ app_pool_name }}"
        state: stopped
      when: app_name != 'reporting-service'
      ignore_errors: yes

    - name: Terminate Spring Boot Java process
      ansible.windows.win_shell: |
        Get-Process javaw, java -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like "*reporting-service.jar*" } | Stop-Process -Force -ErrorAction SilentlyContinue
      when: app_name == 'reporting-service'
      ignore_errors: yes

- name: Restore previous stable artifact
  block:
    - name: Unzip previous stable web/api release
      community.windows.win_unzip:
        src: "C:\\nexora-devops-platform\\artifacts\\{{ app_name }}\\{{ app_name }}-{{ target_version }}.zip"
        dest: "{{ deploy_path }}"
        delete_archive: no
      when: app_name != 'reporting-service'

    - name: Copy previous stable reporting JAR
      ansible.windows.win_copy:
        src: "C:/nexora-devops-platform/artifacts/reporting-service/reporting-service-{{ target_version }}.jar"
        dest: "{{ deploy_path }}\\reporting-service.jar"
        remote_src: yes
      when: app_name == 'reporting-service'

- name: Restart restored application
  block:
    - name: Start IIS AppPool
      ansible.windows.win_iis_webapppool:
        name: "{{ app_pool_name }}"
        state: started
      when: app_name != 'reporting-service'

    - name: Restart IIS Site
      ansible.windows.win_iis_website:
        name: "{{ site_name }}"
        state: restarted
      when: app_name != 'reporting-service'
      ignore_errors: yes

    - name: Start restored Spring Boot service
      ansible.windows.win_shell: |
        Start-Process java -ArgumentList "-jar", "{{ deploy_path }}\\reporting-service.jar", "--server.port=8301" -WindowStyle Hidden
      when: app_name == 'reporting-service'

- name: Record rollback in PostgreSQL audit table
  delegate_to: localhost
  community.postgresql.postgresql_query:
    db: "inventory_db"
    login_host: "localhost"
    login_user: "nexora_admin"
    login_password: "{{ lookup('env', 'DB_PASSWORD') | default('', true) }}"
    query: >
      INSERT INTO deployments (application, version, environment, status, rollback_version, rollback_of, completed_at)
      VALUES ('{{ app_name }}', '{{ target_version }}', '{{ env_name }}', 'ROLLED_BACK', '{{ target_version }}', 'FAILED_RELEASE', CURRENT_TIMESTAMP);
  ignore_errors: no
