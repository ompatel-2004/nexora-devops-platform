[windows]
localhost ansible_host=127.0.0.1 ansible_port=5985 ansible_connection=winrm ansible_winrm_transport=ntlm ansible_winrm_server_cert_validation=ignore

[windows:vars]
ansible_user="{{ lookup('env', 'WINRM_USER') | default('Administrator', true) }}"
ansible_password="{{ lookup('env', 'WINRM_PASSWORD') | default('', true) }}"
