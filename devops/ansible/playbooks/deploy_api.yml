---
- name: Deploy Nexora Inventory API from Nexus
  hosts: windows

  vars:
    app_name: "inventory-api"
    env_name: "{{ env | default('dev') | lower }}"
    app_version: "{{ version | default('1.4.2') }}"

    nexus_base: "{{ lookup('env', 'NEXUS_URL') | default('http://localhost:8081/repository/nexora-releases', true) }}"
    nexus_user: "{{ lookup('env', 'NEXUS_USER') | default('admin', true) }}"
    nexus_pass: "{{ lookup('env', 'NEXUS_PASSWORD') | default('', true) }}"

    target_port: "{{ 8101 if env_name == 'dev' else (8102 if env_name == 'qa' else (8103 if env_name == 'staging' else 8104)) }}"

    app_pool_name: "inventory-api-{{ env_name }}-pool"
    site_name: "inventory-api-{{ env_name }}"
    deploy_path: "C:\\inetpub\\nexora\\{{ env_name }}\\api"

    artifact_filename: "inventory-api-{{ app_version }}.zip"
    checksum_filename: "inventory-api-{{ app_version }}.sha256"

    download_dest: "C:\\nexora-devops-platform\\artifacts\\inventory-api\\{{ artifact_filename }}"
    checksum_dest: "C:\\nexora-devops-platform\\artifacts\\inventory-api\\{{ checksum_filename }}"

    simulate_fail: "{{ simulate_failure | default('false') }}"

  tasks:

    - name: Ensure artifact download directory exists
      ansible.windows.win_file:
        path: "C:\\nexora-devops-platform\\artifacts\\inventory-api"
        state: directory

    - name: Retrieve immutable release package from Nexus
      ansible.windows.win_get_url:
        url: "{{ nexus_base }}/{{ app_name }}/{{ app_version }}/{{ artifact_filename }}"
        dest: "{{ download_dest }}"
        url_username: "{{ nexus_user }}"
        url_password: "{{ nexus_pass }}"
        force: yes

    - name: Retrieve release SHA256 checksum from Nexus
      ansible.windows.win_get_url:
        url: "{{ nexus_base }}/{{ app_name }}/{{ app_version }}/{{ checksum_filename }}"
        dest: "{{ checksum_dest }}"
        url_username: "{{ nexus_user }}"
        url_password: "{{ nexus_pass }}"
        force: yes

    - name: Verify artifact exists after Nexus download
      ansible.windows.win_stat:
        path: "{{ download_dest }}"
      register: artifact_stat
      failed_when: not artifact_stat.stat.exists

    - name: Verify checksum file exists after Nexus download
      ansible.windows.win_stat:
        path: "{{ checksum_dest }}"
      register: checksum_stat
      failed_when: not checksum_stat.stat.exists

    - name: Read expected SHA256 checksum
      ansible.windows.win_shell: |
        (Get-Content -Path "{{ checksum_dest }}" -Raw).Trim().Split()[0]
      register: expected_checksum
      changed_when: false

    - name: Calculate downloaded artifact SHA256
      ansible.windows.win_shell: |
        (Get-FileHash -Path "{{ download_dest }}" -Algorithm SHA256).Hash
      register: actual_checksum
      changed_when: false

    - name: Verify artifact SHA256 integrity
      ansible.builtin.assert:
        that:
          - actual_checksum.stdout | trim | upper == expected_checksum.stdout | trim | upper
        fail_msg: >-
          SHA256 integrity verification failed for {{ artifact_filename }}.
          Expected={{ expected_checksum.stdout | trim }},
          Actual={{ actual_checksum.stdout | trim }}
        success_msg: >-
          SHA256 integrity verification passed for {{ artifact_filename }}:
          {{ actual_checksum.stdout | trim }}

    - name: Include standard application deployment role
      include_role:
        name: application_deploy
      vars:
        artifact_path: "{{ download_dest }}"
