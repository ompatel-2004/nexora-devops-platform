---
- name: Deploy Nexora Inventory API to Windows IIS
  hosts: windows
  vars:
    app_name: "inventory-api"
    env_name: "{{ env | default('dev') | lower }}"
    app_version: "{{ version | default('1.4.2') }}"
    target_port: "{{ 8101 if env_name == 'dev' else (8102 if env_name == 'qa' else (8103 if env_name == 'staging' else 8104)) }}"
    app_pool_name: "inventory-api-{{ env_name }}-pool"
    site_name: "inventory-api-{{ env_name }}"
    deploy_path: "C:\\inetpub\\nexora\\{{ env_name }}\\api"
    simulate_fail: "{{ simulate_failure | default('false') }}"
  roles:
    - application_deploy
