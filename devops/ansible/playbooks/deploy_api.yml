---
- name: Deploy Inventory API to Target IIS Environment
  hosts: windows
  gather_facts: false
  vars:
    app_version: "{{ version | default('1.4.1') }}"
    env_name: "{{ env | default('dev') }}"
    site_name: "inventory-api-{{ env_name }}"
    app_pool_name: "inventory-api-{{ env_name }}-pool"
    deploy_path: "C:\\inetpub\\nexora\\{{ env_name }}\\api"
    artifact_path: "C:\\nexora-devops-platform\\artifacts\\inventory-api\\inventory-api-{{ app_version }}.zip"
    target_port: "{{ 8101 if env_name == 'dev' else (8102 if env_name == 'qa' else (8103 if env_name == 'staging' else 8104)) }}"
    log_level: "{{ 'Debug' if env_name == 'dev' else 'Information' }}"
  roles:
    - application_deploy
