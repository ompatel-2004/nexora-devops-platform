---
- name: Deploy Nexora Inventory Web Dashboard
  hosts: windows
  vars:
    app_name: "inventory-web"
    env_name: "{{ env | default('dev') | lower }}"
    app_version: "{{ version | default('1.4.2') }}"
    target_port: "{{ 8201 if env_name == 'dev' else (8202 if env_name == 'qa' else (8203 if env_name == 'staging' else 8204)) }}"
    api_port: "{{ 8101 if env_name == 'dev' else (8102 if env_name == 'qa' else (8103 if env_name == 'staging' else 8104)) }}"
    app_pool_name: "inventory-web-{{ env_name }}-pool"
    site_name: "inventory-web-{{ env_name }}"
    deploy_path: "C:\\inetpub\\nexora\\{{ env_name }}\\web"
    artifact_path: "C:\\nexora-devops-platform\\artifacts\\inventory-web\\inventory-web-{{ app_version }}.zip"
  tasks:
    - name: Ensure target directory exists
      ansible.windows.win_file:
        path: "{{ deploy_path }}"
        state: directory

    - name: Stop Web AppPool
      ansible.windows.win_iis_webapppool:
        name: "{{ app_pool_name }}"
        state: stopped
      ignore_errors: yes

    - name: Extract Web Artifact
      community.windows.win_unzip:
        src: "{{ artifact_path }}"
        dest: "{{ deploy_path }}"
        delete_archive: no

    - name: Write runtime environment configuration matching frontend casing
      ansible.windows.win_copy:
        dest: "{{ deploy_path }}\\env.js"
        content: |
          (function (window) {
            window.__env = window.__env || {};
            window.__env.apiUrl = 'http://localhost:{{ api_port }}';
            window.__env.environmentName = '{{ env_name | upper }}';
          }(this));

    - name: Start Web AppPool
      ansible.windows.win_iis_webapppool:
        name: "{{ app_pool_name }}"
        state: started

    - name: Restart IIS Web Site
      ansible.windows.win_iis_website:
        name: "{{ site_name }}"
        state: restarted
      ignore_errors: yes
