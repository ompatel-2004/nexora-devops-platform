---
- name: Deploy Nexora Inventory Web Dashboard from Nexus
  hosts: windows
  vars:
    app_name: "inventory-web"
    env_name: "{{ env | default('dev') | lower }}"
    app_version: "{{ version | default('1.4.2') }}"
    nexus_base: "{{ lookup('env', 'NEXUS_URL') | default('http://localhost:8081/repository/nexora-releases', true) }}"
    nexus_user: "{{ lookup('env', 'NEXUS_USER') | default('admin', true) }}"
    nexus_pass: "{{ lookup('env', 'NEXUS_PASSWORD') | default('', true) }}"
    target_port: "{{ 8201 if env_name == 'dev' else (8202 if env_name == 'qa' else (8203 if env_name == 'staging' else 8204)) }}"
    api_port: "{{ 8101 if env_name == 'dev' else (8102 if env_name == 'qa' else (8103 if env_name == 'staging' else 8104)) }}"
    app_pool_name: "inventory-web-{{ env_name }}-pool"
    site_name: "inventory-web-{{ env_name }}"
    deploy_path: "C:\\inetpub\\nexora\\{{ env_name }}\\web"
    artifact_filename: "inventory-web-{{ app_version }}.zip"
    download_dest: "C:\\nexora-devops-platform\\artifacts\\inventory-web\\{{ artifact_filename }}"
  tasks:
    - name: Ensure artifact download directory exists
      ansible.windows.win_file:
        path: "C:\\nexora-devops-platform\\artifacts\\inventory-web"
        state: directory

    - name: Retrieve immutable web package from Nexus
      ansible.windows.win_get_url:
        url: "{{ nexus_base }}/{{ app_name }}/{{ app_version }}/{{ artifact_filename }}"
        dest: "{{ download_dest }}"
        url_username: "{{ nexus_user }}"
        url_password: "{{ nexus_pass }}"
        force: yes
      register: nexus_web_download
      ignore_errors: yes

    - name: Ensure target directory exists
      ansible.windows.win_file:
        path: "{{ deploy_path }}"
        state: directory

    - name: Stop Web AppPool
      ansible.windows.win_iis_webapppool:
        name: "{{ app_pool_name }}"
        state: stopped
      ignore_errors: yes

    - name: Extract Web Artifact
      community.windows.win_unzip:
        src: "{{ download_dest }}"
        dest: "{{ deploy_path }}"
        delete_archive: no

    - name: Write runtime environment configuration matching frontend casing
      ansible.windows.win_copy:
        dest: "{{ deploy_path }}\\env.js"
        content: |
          (function (window) {
            window.__env = window.__env || {};
            window.__env.apiUrl = 'http://localhost:{{ api_port }}';
            window.__env.environmentName = '{{ env_name | upper }}';
          }(this));

    - name: Start Web AppPool
      ansible.windows.win_iis_webapppool:
        name: "{{ app_pool_name }}"
        state: started

    - name: Restart IIS Web Site
      ansible.windows.win_iis_website:
        name: "{{ site_name }}"
        state: restarted
      ignore_errors: yes
