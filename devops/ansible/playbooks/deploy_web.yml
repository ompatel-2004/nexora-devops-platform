---
- name: Deploy Nexora Inventory Web Dashboard from Nexus
  hosts: windows

  vars:
    app_name: "inventory-web"
    env_name: "{{ env | default('dev') | lower }}"
    app_version: "{{ version | default('1.4.2') }}"

    nexus_base: "{{ lookup('env', 'NEXUS_URL') | default('http://localhost:8081/repository/nexora-releases', true) }}"
    nexus_user: "{{ lookup('env', 'NEXUS_USER') | default('admin', true) }}"
    nexus_pass: "{{ lookup('env', 'NEXUS_PASSWORD') | default('', true) }}"

    target_port: "{{ 8201 if env_name == 'dev' else (8202 if env_name == 'qa' else (8203 if env_name == 'staging' else 8204)) }}"
    api_port: "{{ 8101 if env_name == 'dev' else (8102 if env_name == 'qa' else (8103 if env_name == 'staging' else 8104)) }}"

    app_pool_name: "inventory-web-{{ env_name }}-pool"
    site_name: "inventory-web-{{ env_name }}"
    deploy_path: "C:\\inetpub\\nexora\\{{ env_name }}\\web"

    artifact_filename: "inventory-web-{{ app_version }}.zip"
    checksum_filename: "inventory-web-{{ app_version }}.sha256"

    download_dest: "C:\\nexora-devops-platform\\artifacts\\inventory-web\\{{ artifact_filename }}"
    checksum_dest: "C:\\nexora-devops-platform\\artifacts\\inventory-web\\{{ checksum_filename }}"

  tasks:

    - name: Ensure artifact download directory exists
      ansible.windows.win_file:
        path: "C:\\nexora-devops-platform\\artifacts\\inventory-web"
        state: directory

    - name: Retrieve immutable web package from Nexus
      ansible.windows.win_get_url:
        url: "{{ nexus_base }}/{{ app_name }}/{{ app_version }}/{{ artifact_filename }}"
        dest: "{{ download_dest }}"
        url_username: "{{ nexus_user }}"
        url_password: "{{ nexus_pass }}"
        force: yes

    - name: Retrieve release SHA256 checksum from Nexus
      ansible.windows.win_get_url:
        url: "{{ nexus_base }}/{{ app_name }}/{{ app_version }}/{{ checksum_filename }}"
        dest: "{{ checksum_dest }}"
        url_username: "{{ nexus_user }}"
        url_password: "{{ nexus_pass }}"
        force: yes

    - name: Verify artifact exists after Nexus download
      ansible.windows.win_stat:
        path: "{{ download_dest }}"
      register: artifact_stat
      failed_when: not artifact_stat.stat.exists

    - name: Verify checksum file exists after Nexus download
      ansible.windows.win_stat:
        path: "{{ checksum_dest }}"
      register: checksum_stat
      failed_when: not checksum_stat.stat.exists

    - name: Read expected SHA256 checksum
      ansible.windows.win_shell: |
        (Get-Content -Path "{{ checksum_dest }}" -Raw).Trim().Split()[0]
      register: expected_checksum
      changed_when: false

    - name: Calculate downloaded artifact SHA256
      ansible.windows.win_shell: |
        (Get-FileHash -Path "{{ download_dest }}" -Algorithm SHA256).Hash
      register: actual_checksum
      changed_when: false

    - name: Verify artifact SHA256 integrity
      ansible.builtin.assert:
        that:
          - actual_checksum.stdout | trim | upper == expected_checksum.stdout | trim | upper
        fail_msg: >-
          SHA256 integrity verification failed for {{ artifact_filename }}.
          Expected={{ expected_checksum.stdout | trim }},
          Actual={{ actual_checksum.stdout | trim }}
        success_msg: >-
          SHA256 integrity verification passed for {{ artifact_filename }}:
          {{ actual_checksum.stdout | trim }}

    - name: Ensure target directory exists
      ansible.windows.win_file:
        path: "{{ deploy_path }}"
        state: directory

    - name: Stop Web AppPool
      ansible.windows.win_iis_webapppool:
        name: "{{ app_pool_name }}"
        state: stopped
      ignore_errors: yes

    - name: Extract Web Artifact
      community.windows.win_unzip:
        src: "{{ download_dest }}"
        dest: "{{ deploy_path }}"
        delete_archive: no

    - name: Write runtime environment configuration matching frontend casing
      ansible.windows.win_copy:
        dest: "{{ deploy_path }}\\env.js"
        content: |
          (function (window) {
            window.__env = window.__env || {};
            window.__env.apiUrl = 'http://localhost:{{ api_port }}';
            window.__env.environmentName = '{{ env_name | upper }}';
          }(this));

    - name: Start Web AppPool
      ansible.windows.win_iis_webapppool:
        name: "{{ app_pool_name }}"
        state: started

    - name: Restart IIS Web Site
      ansible.windows.win_iis_website:
        name: "{{ site_name }}"
        state: restarted
      ignore_errors: yes
